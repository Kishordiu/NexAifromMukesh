name: One-time NexAI lockfile refresh

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/lockfile-refresh.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate the frontend npm lockfile
        working-directory: nexai-web
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile and remove this one-time workflow
        run: |
          git rm .github/workflows/lockfile-refresh.yml
          git add nexai-web/package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: synchronize NexAI Playwright lockfile"
          git push
      - name: Verify lockfile consistency
        working-directory: nexai-web
        run: npm ci --ignore-scripts --dry-run
